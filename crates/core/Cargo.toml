[package]
name = "core"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
hound = "3.5.1"
crossbeam-channel = "0.5.15"
ctrlc = "3.5.2"
audio = { path = "../audio" }
stt = { path = "../stt" }
storage = { path = "../storage" }
embedding = { path = "../embedding" }
detection = { path = "../detection" }
llm = { path = "../llm" }
migration = { path = "../../migration" }
ringbuf = "0.5.0"
chrono = "0.4.44"
sea-orm = "2.0.0-rc.38"
sea-orm-migration = "2.0.0-rc.38"
sha2 = "0.10.9"
uuid = { version = "1.23.1", features = ["v4"] }
futures-core = "0.3.31"
futures-util = "0.3.31"
keyring = "3.6.3"
tokio = { version = "1.48.0", features = ["rt", "sync"] }
