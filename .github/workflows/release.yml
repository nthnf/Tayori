name: Build and Release

on:
  push:
    tags:
      - 'v*' # Trigger when a tag like v1.0.0 is pushed

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Dioxus CLI
        run: cargo install dioxus-cli --locked

      - name: Build Windows Installer
        env:
          CFLAGS: "-MD"
          CXXFLAGS: "-MD"
        run: dx bundle --release --platform desktop

      - name: Upload Windows Asset
        uses: actions/upload-artifact@v4
        with:
          name: tayori-windows
          path: target/dx/tayori/bundle/windows/nsis/*.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libssl-dev pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev libpipewire-0.3-dev libpulse-dev clang libclang-dev libxdo-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install Dioxus CLI
        run: cargo install dioxus-cli --locked

      - name: Build Linux AppImage and DEB
        run: dx bundle --release --platform desktop

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: tayori-linux-appimage
          path: target/dx/tayori/bundle/linux/appimage/*.AppImage

  publish-release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: tayori-windows
          path: dist/

      - name: Download Linux AppImage
        uses: actions/download-artifact@v4
        with:
          name: tayori-linux-appimage
          path: dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
